name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml

      - name: Train, evaluate, and generate on a slice of MNIST
        run: |
          uv run python scripts/train_models.py --epochs 1 --train_size 2000 --seeds 42
          uv run python scripts/evaluate_models.py --sample_size 1000
          uv run python scripts/generate_digits.py --digits 2026 --seed 1

  docker:
    name: Build and smoke test the image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: digitgan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Train and serve inside the container
        run: |
          docker run --detach --name digitgan --publish 8000:8000 digitgan:ci \
            sh -c 'python scripts/train_models.py --models cgan --seeds 42 --epochs 1 --train_size 2000 \
              && python scripts/run_api.py'
          curl --fail --silent --show-error --retry 60 --retry-delay 5 --retry-all-errors \
            http://localhost:8000/health

      - name: Generate a number
        run: |
          curl --fail --silent --show-error --output 2026.png \
            'http://localhost:8000/generate?digits=2026&seed=1'
          file 2026.png | grep 'PNG image data, 448 x 112'

      - name: Show container logs
        if: always()
        run: docker logs digitgan
