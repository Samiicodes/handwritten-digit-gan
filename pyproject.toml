[project]
name = 'digitgan'
version = '0.1.0'
description = 'Handwritten digit generation with GANs: a controlled comparison of a baseline, a vanilla GAN, a DCGAN, and a conditional GAN on MNIST.'
readme = 'README.md'
requires-python = '>=3.12'
license = 'MIT'
license-files = ['LICENSE']
authors = [{ name = 'Sami Asghar' }]
dependencies = [
    'fastapi',
    'matplotlib',
    'numpy',
    'pillow',
    'pydantic',
    'pydantic-settings',
    'pyyaml',
    'torch',
    'torchvision',
    'uvicorn',
]

[dependency-groups]
dev = [
    'httpx2',
    'mypy',
    'pre-commit',
    'pre-commit-hooks',
    'pytest',
    'pytest-cov',
    'ruff',
    'types-pyyaml',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/digitgan']

[tool.uv]
required-version = '>=0.13'
# Resolve against a fixed date so that relocking gives the same versions
exclude-newer = '2026-10-01T00:00:00Z'

# CPU builds of PyTorch. The default Linux wheels pull in several GB of CUDA libraries
# that a 28x28 dataset does not need.
[tool.uv.sources]
torch = { index = 'pytorch-cpu' }
torchvision = { index = 'pytorch-cpu' }

[[tool.uv.index]]
name = 'pytorch-cpu'
url = 'https://download.pytorch.org/whl/cpu'
explicit = true

[tool.ruff]
line-length = 100
target-version = 'py312'

[tool.ruff.format]
# Keep single-quoted docstrings; the formatter would otherwise switch them to double quotes
quote-style = 'preserve'

[tool.ruff.lint]
select = [
    'B',    # bugbear
    'C4',   # comprehensions
    'D',    # docstrings
    'E',    # pycodestyle errors
    'F',    # pyflakes
    'I',    # import order
    'N',    # naming
    'PTH',  # pathlib
    'Q',    # quotes
    'RUF',  # ruff-specific
    'SIM',  # simplify
    'UP',   # pyupgrade
    'W',    # pycodestyle warnings
]
ignore = [
    'D105',  # magic methods are self-explanatory
    'D107',  # classes document their constructor arguments
    'D300',  # docstrings use single quotes like the rest of the code
]

[tool.ruff.lint.per-file-ignores]
'tests/*' = ['D']
# matplotlib.use must run before pyplot is imported
'src/digitgan/plotting.py' = ['E402']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = 'single'
docstring-quotes = 'single'

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.mypy]
python_version = '3.12'
strict = true
plugins = ['pydantic.mypy']
files = ['src', 'scripts', 'tests']
mypy_path = 'src'

[[tool.mypy.overrides]]
# torchvision ships without complete type information
module = ['torchvision.*']
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = ['--strict-markers', '--strict-config']
filterwarnings = ['error::pytest.PytestUnraisableExceptionWarning']

[tool.coverage.run]
source = ['digitgan']
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
